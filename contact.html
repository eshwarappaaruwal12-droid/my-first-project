<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact me using the form.">
  <title>Contact | My Personal Site</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">My Site</a>
      <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container section">
    <h1>Contact</h1>
    <p class="lead">Have a question or want to work together? Send me a message.</p>

    <form id="contact-form" class="contact-form" novalidate>
      <div class="form-row">
        <div class="form-field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
          <p class="field-error" id="name-error" aria-live="polite"></p>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>
      </div>

      <div class="form-field">
        <label for="subject">Subject <span class="muted">(optional)</span></label>
        <input id="subject" name="subject" type="text">
      </div>

      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required aria-describedby="message-error"></textarea>
        <p class="field-error" id="message-error" aria-live="polite"></p>
      </div>

      <button class="btn btn-primary" type="submit">Send message</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span class="js-year">2026</span> Your Name. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>

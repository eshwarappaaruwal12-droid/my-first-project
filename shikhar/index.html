<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shikhar Parekh — Arth Email Signature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Arth Email Signature V4 — Shikhar Parekh — 700×200 (Figma node 2738:2) -->
  <div class="signature">

    <!-- Background contour rings -->
    <img class="contour contour-1" src="assets/contour-1.svg" width="520" height="180" alt="">
    <img class="contour contour-2" src="assets/contour-2.svg" width="440" height="140" alt="">
    <img class="contour contour-3" src="assets/contour-3.svg" width="360" height="100" alt="">
    <img class="contour contour-4" src="assets/contour-4.svg" width="300" height="160" alt="">
    <img class="contour contour-5" src="assets/contour-5.svg" width="220" height="110" alt="">

    <!-- White card -->
    <div class="card"></div>

    <!-- Profile photo -->
    <img class="profile-photo" src="assets/profile-photo.png" width="106" height="106" alt="Shikhar Parekh">

    <!-- Floating shapes -->
    <img class="float-circle float-circle-1" src="assets/float-circle-1.svg" width="16" height="16" alt="">
    <img class="float-circle float-circle-2" src="assets/float-circle-2.svg" width="10" height="10" alt="">
    <div class="float-square"></div>
    <div class="float-triangle">
      <img src="assets/float-triangle.svg" width="13.8564" height="10.5" alt="">
    </div>

    <!-- Arth logo -->
    <a class="logo" href="https://arthproject.com" aria-label="Arth">
      <span class="logo-mark">
        <span class="logo-mark-frame">
          <img src="assets/logo-texture.png" alt="">
        </span>
      </span>
      <img class="logo-wordmark" src="assets/wordmark.svg" width="48.2168" height="20.506" alt="arth">
    </a>

    <!-- Tag pill -->
    <div class="tag-pill">Making Property Click</div>

    <!-- Name, designation, address -->
    <p class="name">Shikhar Parekh</p>
    <p class="designation">Co-Founder &amp; Business Head</p>
    <p class="address">Manpho Stambh, 1st Main Rd, opposite Shri Vasupujya Swami Jain Temple, Hebbal, Bengaluru, Karnataka 560032</p>

    <!-- Contact details -->
    <ul class="contacts">
      <li>
        <span class="contact-icon"><img src="assets/icon-phone.svg" width="8.96" height="8.96" alt=""></span>
        <a href="tel:+919448030000">+91 94480 30000</a>
      </li>
      <li>
        <span class="contact-icon"><img src="assets/icon-email.svg" width="8.96" height="8.96" alt=""></span>
        <a href="mailto:shikhar@arthproject.com">shikhar@arthproject.com</a>
      </li>
      <li>
        <span class="contact-icon"><img src="assets/icon-website.svg" width="8.96" height="8.96" alt=""></span>
        <a href="https://arthproject.com">arthproject.com</a>
      </li>
    </ul>

    <!-- Social icons (replace # with the real profile URLs) -->
    <div class="socials">
      <a class="social social-instagram" href="#" aria-label="Instagram"><img src="assets/instagram.png" alt=""></a>
      <a class="social social-facebook" href="#" aria-label="Facebook"><img src="assets/facebook.png" alt=""></a>
      <a class="social social-linkedin" href="#" aria-label="LinkedIn"><img src="assets/linkedin.png" alt=""></a>
      <a class="social social-whatsapp" href="https://wa.me/919448030000" aria-label="WhatsApp"><img src="assets/whatsapp.png" alt=""></a>
    </div>

  </div>

</body>
</html>
